[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-repair"
version = "0.1.0"
description = "Deterministic verify-versus-repair memory substrate"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]
semantic = ["faiss-cpu>=1.8", "FlagEmbedding>=1.2"]
analysis = ["matplotlib>=3.7"]
llm = ["torch>=2.3", "transformers>=4.46", "accelerate>=0.34", "bitsandbytes>=0.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "semantic: requires optional BGE-M3 model and FAISS",
    "llm: requires optional local LLM runtime and model weights",
]
addopts = "-m 'not semantic and not llm'"
